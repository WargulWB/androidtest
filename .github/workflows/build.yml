name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'graalvm'
          java-version: '21'
          cache: 'maven'

      # explicitly install Maven 3.8.8 because the gluon plugin does not work with newer versions
      # but the ubuntu image comes with a new maven version preinstalled
      - name: Install Maven 3.8.8
        run: |
          wget https://archive.apache.org/dist/maven/maven-3/3.8.8/binaries/apache-maven-3.8.8-bin.tar.gz
          tar -xzf apache-maven-3.8.8-bin.tar.gz
          sudo mv apache-maven-3.8.8 /opt/maven
          sudo rm -f /usr/bin/mvn  # Remove existing symbolic link if it exists
          sudo ln -s /opt/maven/bin/mvn /usr/bin/mvn  # Create new symbolic link

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Maven
        run: |
          # Verify the correct version is loaded in this step
          mvn -version
          mvn clean gluonfx:build
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          GRAALVM_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: target/gluonfx/aarch64-linux-android/gvm/*.apk